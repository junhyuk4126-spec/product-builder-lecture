<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4969667166387075" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark Mode</button>
        <h1>Lotto Number Generator</h1>
        <div class="lotto-numbers" id="lotto-numbers"></div>
        <button id="generate-btn">Generate Numbers</button>

        <form class="contact-form" action="https://formspree.io/f/mkoeeelv" method="POST">
            <h2>Partnership Inquiry</h2>
            <label for="partner-name">Name</label>
            <input id="partner-name" name="name" type="text" autocomplete="name" required>

            <label for="partner-email">Email</label>
            <input id="partner-email" name="email" type="email" autocomplete="email" required>

            <label for="partner-message">Message</label>
            <textarea id="partner-message" name="message" rows="4" required></textarea>

            <input type="hidden" name="_subject" value="New partnership inquiry">
            <button class="submit-btn" type="submit">Send Inquiry</button>
        </form>

        <section class="comments-section" aria-label="Comments">
            <h2>Comments</h2>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                    var d = document, s = d.createElement('script');
                    s.src = 'https://productbuilder1-6.disqus.com/embed.js';
                    s.setAttribute('data-timestamp', +new Date());
                    (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
